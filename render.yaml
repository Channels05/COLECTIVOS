# Blueprint de Render: API + Redis (Key Value) en el plan gratis. La base de datos va en Neon
# (Postgres gratis que no vence, con PostGIS): su URL se pega a mano en DATABASE_URL.
# En Render: New > Blueprint > elegir este repositorio. Ver README.md ("Desplegar en la nube").
#
# Límites del plan gratis: la API se duerme tras 15 min sin tráfico (~1 min en despertar) y Redis
# no persiste a disco. (La base gratis de Render vence a los 30 días: por eso se usa Neon.)
services:
  - type: web
    name: colectivos-api
    runtime: docker
    plan: free
    region: virginia # la más cercana a Chile entre las disponibles
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # la de Neon (Dashboard > Connect), tal cual; la app la adapta a asyncpg
      - key: REDIS_URL
        fromService:
          name: colectivos-redis
          type: keyvalue
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true # se ve en el panel de Render (Environment) para entrar a /admin
      - key: RUN_WORKER_IN_PROCESS
        value: "true" # los workers aparte no tienen plan gratis

  - type: keyvalue
    name: colectivos-redis
    plan: free
    region: virginia
    maxmemoryPolicy: noeviction # el stream de ubicaciones no se debe perder por falta de memoria
    ipAllowList: [] # solo accesible desde los servicios de Render
