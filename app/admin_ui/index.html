<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administración · Colectivos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0b6e4f; --primary-soft: #e3f2ec; --bg: #f3f6f4; --surface: #fff; --text: #16201b;
      --muted: #5f6b66; --border: #dce3df; --warning: #b7791f; --warning-bg: #fff7e6; --danger: #c5221f;
      --official: #3f51b5; --raw: #8a958f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; color: var(--primary); }
    header .key { margin-left: auto; display: flex; gap: 8px; }
    input, textarea, button { font: inherit; }
    input, textarea { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
    button { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: default; }
    main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 57px); }
    aside { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
    .tabs { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tabs button { background: var(--bg); color: var(--muted); padding: 6px 10px; }
    .tabs button.active { background: var(--primary); color: #fff; }
    .item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .item:hover { background: var(--bg); }
    .item.selected { background: var(--primary-soft); }
    .item .title { font-weight: 700; }
    .item .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; margin: 4px 4px 0 0; }
    .badge.warn { background: var(--warning-bg); color: var(--warning); }
    .badge.new { background: #e8eaf6; color: var(--official); }
    .badge.ok { background: var(--primary-soft); color: var(--primary); }
    .badge.passenger { background: #f3e8fd; color: #7b1fa2; }
    .modes { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 3px; }
    .modes button { background: transparent; color: var(--muted); padding: 6px 12px; }
    .modes button.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin: 8px 0; }
    .field input, .field select { width: 100%; color: var(--text); }
    select { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; background: var(--surface); }
    .quote { background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
    .empty { padding: 24px; color: var(--muted); text-align: center; }
    section.view { position: relative; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; z-index: 1000; right: 16px; top: 16px; width: 340px; max-height: calc(100% - 32px); overflow-y: auto;
             background: var(--surface); border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.15); padding: 16px; }
    .panel h2 { margin: 0 0 4px; font-size: 18px; }
    .panel table { width: 100%; font-size: 13px; border-collapse: collapse; margin: 10px 0; }
    .panel td { padding: 3px 0; } .panel td:last-child { text-align: right; font-weight: 600; }
    .warning { background: var(--warning-bg); color: var(--warning); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
    .legend { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin: 10px 0; }
    .legend span::before { content: ""; display: inline-block; width: 22px; height: 0; border-top: 4px solid; margin-right: 8px; vertical-align: middle; }
    .legend .proposed::before { border-color: var(--primary); }
    .legend .raw::before { border-top: 2px dotted var(--raw); }
    .legend .official::before { border-top: 3px dashed var(--official); }
    .legend .recorded::before { border-top: 6px solid rgba(224, 122, 31, .45); }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 8px 0; }
    /* Pantallas chicas: lista más angosta y el detalle abajo del mapa (no tapa el recorrido). */
    @media (max-width: 1100px) {
      main { grid-template-columns: 250px 1fr; }
      .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 48%; }
    }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button { flex: 1; }
    textarea { width: 100%; min-height: 56px; resize: vertical; }
    .status-line { font-size: 13px; color: var(--muted); }
    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .qr { display: grid; justify-items: center; gap: 8px; margin: 12px 0; }
    .qr img { width: 240px; height: 240px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 8px; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .kpi { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
    .kpi b { display: block; font-size: 22px; color: var(--primary); font-variant-numeric: tabular-nums; }
    .kpi span { font-size: 12px; color: var(--muted); }
    .panel h3 { font-size: 14px; margin: 14px 0 4px; }
    .zone { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border);
            font-size: 13px; cursor: pointer; }
    .zone:hover { color: var(--primary); }
    .legend .sightings::before { border-top: 8px solid rgba(11, 110, 79, .6); }
    .legend .recordings::before { border-top: 8px solid rgba(224, 122, 31, .6); }
    pre.stack { background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 11px; white-space: pre-wrap;
                word-break: break-word; max-height: 320px; overflow-y: auto; margin: 6px 0; }
    .badge.danger { background: #fdecea; color: var(--danger); }
    .bars { display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 2px; height: 120px; margin: 12px 0 4px; }
    .bars div { background: var(--primary); border-radius: 3px 3px 0 0; min-height: 2px; }
    .bars div.empty { background: var(--border); }
    .bars-axis { display: grid; grid-template-columns: repeat(24, 1fr); font-size: 10px; color: var(--muted); text-align: center; }
    .car-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
               color: #fff; font: 700 11px/22px system-ui; text-align: center; }
    .secret { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Colectivos · Administración</h1>
    <div class="modes" id="modes">
      <button data-mode="recordings" class="active">Recorridos grabados</button>
      <button data-mode="lines">Líneas propuestas</button>
      <button data-mode="vehicles">Vehículos</button>
      <button data-mode="lineinfo">Tarifas y horarios</button>
      <button data-mode="notices">Avisos</button>
      <button data-mode="reports">Reportes</button>
      <button data-mode="misses">Sin resultado</button>
      <button data-mode="fleet">Flota</button>
      <button data-mode="occupancy">Ocupación</button>
      <button data-mode="stats">Datos</button>
      <button data-mode="errors">Errores</button>
    </div>
    <div class="key">
      <input id="key" type="password" placeholder="Clave de administrador" autocomplete="off" />
      <button class="btn-primary" id="enter">Entrar</button>
    </div>
  </header>
  <main>
    <aside>
      <div class="tabs" id="tabs"></div>
      <div id="list"><div class="empty">Ingresa la clave de administrador.</div></div>
    </aside>
    <section class="view">
      <div id="map"></div>
      <div class="panel" id="panel" hidden></div>
    </section>
  </main>

<script>
// Página de revisión: consume la API de administración con la clave en el header X-Admin-Key.
// La clave se guarda solo en sessionStorage (se borra al cerrar la pestaña).
const API = "/api/v1";
const DIR = { ida: "Ida", regreso: "Regreso" };
const dirLabel = (d) => d ? DIR[d] : "Sentido sin indicar";
// Dos bandejas: recorridos grabados (conductores y pasajeros) y líneas que propusieron pasajeros.
const TABS = {
  recordings: [["pending_review", "Pendientes"], ["approved", "Aprobadas"], ["rejected", "Rechazadas"],
               ["cancelled", "Canceladas"], ["recording", "Grabando"]],
  lines: [["pending_review", "Pendientes"], ["active", "Aprobadas"], ["rejected", "Rechazadas"]],
  vehicles: [["all", "Todos"]],
  stats: [["28", "4 semanas"], ["7", "7 días"], ["90", "3 meses"]],  // período en días
  errors: [["7", "7 días"], ["30", "30 días"], ["90", "90 días"]],
  fleet: [["all", "En vivo"]],
  occupancy: [["30", "30 días"], ["7", "7 días"]],
  lineinfo: [["pending", "Pendientes"], ["applied", "Aplicados"], ["discarded", "Descartados"]],
  notices: [["active", "Vigentes"]],
  reports: [["pending", "Pendientes"], ["applied", "Resueltos"], ["discarded", "Descartados"]],
  misses: [["30", "30 días"], ["7", "7 días"], ["90", "90 días"]],
};
let mode = "recordings";
let currentStatus = "pending_review";
let selectedId = null;
const layers = L.layerGroup();

const map = L.map("map").setView([-33.45, -70.65], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);
layers.addTo(map);

const keyInput = document.getElementById("key");
keyInput.value = sessionStorage.getItem("adminKey") || "";

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Admin-Key": keyInput.value, ...(options.headers || {}) },
  });
  if (!res.ok) {
    let detail = `Error ${res.status}`;
    try { const body = await res.json(); detail = typeof body.detail === "string" ? body.detail : detail; } catch {}
    throw new Error(res.status === 403 ? "Clave de administrador incorrecta." : detail);
  }
  return res.json();
}

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of children) node.append(child);
  return node;
}

const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" }) : "—";
const km = (m) => m == null ? "—" : `${(m / 1000).toFixed(1).replace(".", ",")} km`;

function renderTabs() {
  document.getElementById("tabs").replaceChildren(...TABS[mode].map(([status, label]) =>
    el("button", { className: status === currentStatus ? "active" : "", textContent: label, onclick: () => {
      currentStatus = status;
      closePanel();
      renderTabs();
      loadList();
    } })));
}

function closePanel() {
  selectedId = null;
  layers.clearLayers();
  document.getElementById("panel").hidden = true;
}

const recordedBy = (r) => r.recorded_by === "driver" ? `Conductor ${r.plate}` : "Pasajero";
const lineLabel = (r) => r.line_name ? `${r.line_name} (${r.line_code})` : `Línea ${r.line_code}`;

async function loadList() {
  sessionStorage.setItem("adminKey", keyInput.value);
  return mode === "lines" ? loadLines() : mode === "vehicles" ? loadVehicles()
    : mode === "stats" ? loadStats() : mode === "errors" ? loadErrors() : mode === "fleet" ? loadFleet()
    : mode === "occupancy" ? loadOccupancy() : mode === "lineinfo" ? loadLineInfo()
    : mode === "notices" ? loadNotices() : mode === "reports" ? loadReports() : mode === "misses" ? loadMisses()
    : loadRecordings();
}

async function loadRecordings() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  try {
    const items = await api(`/admin/recordings?status_filter=${currentStatus}`);
    if (!items.length) {
      list.replaceChildren(el("div", { className: "empty", textContent: "No hay grabaciones en este estado." }));
      return;
    }
    list.replaceChildren(...items.map((r) => {
      const badges = el("div");
      if (r.recorded_by === "passenger") badges.append(el("span", { className: "badge passenger", textContent: "Aporte de pasajero" }));
      if (r.line_status === "pending_review") badges.append(el("span", { className: "badge new", textContent: "Línea nueva propuesta" }));
      else if (!r.line_has_official_route) badges.append(el("span", { className: "badge new", textContent: "Línea sin trazado oficial" }));
      if (r.warnings.length) badges.append(el("span", { className: "badge warn", textContent: `${r.warnings.length} advertencia(s)` }));
      if (r.status === "approved") badges.append(el("span", { className: "badge ok", textContent: "Aprobada" }));
      const item = el("div", { className: "item" + (r.id === selectedId ? " selected" : "") },
        el("div", { className: "title", textContent: `${lineLabel(r)} · ${dirLabel(r.direction)}` }),
        el("div", { className: "meta", textContent: `${recordedBy(r)} · ${fmtDate(r.started_at)} · ${km(r.stats?.length_m)} · ${r.stats?.used_points ?? "—"} puntos` }),
        badges,
      );
      item.onclick = () => select(r.id);
      return item;
    }));
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
  }
}

async function select(id) {
  selectedId = id;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(el("div", { className: "status-line", textContent: "Cargando…" }));
  try {
    const r = await api(`/admin/recordings/${id}`);
    renderPanel(r); // primero el panel: drawMap mide su tamaño para encuadrar el recorrido
    drawMap(r);
    loadList();
  } catch (err) {
    panel.replaceChildren(el("div", { className: "error", textContent: err.message }));
  }
}

async function drawMap(r) {
  layers.clearLayers();
  const bounds = [];
  // Trazado oficial de la línea (si existe) y lo ya grabado en el mismo sentido, para comparar.
  try {
    const routes = await fetch(`${API}/routes/${encodeURIComponent(r.line_code)}`).then((x) => x.ok ? x.json() : null);
    for (const f of routes?.features || []) {
      if (f.properties.source !== "recorded") {
        L.geoJSON(f.geometry, { style: { color: "#3f51b5", weight: 3, dashArray: "8 8", opacity: .8 } }).addTo(layers);
      } else if (!r.direction || f.properties.direction === r.direction) {
        L.geoJSON(f.geometry, { style: { color: "#e07a1f", weight: 8, opacity: .45 } }).addTo(layers);
      }
    }
  } catch {}
  if (r.raw) {
    const raw = L.geoJSON(r.raw, { style: { color: "#8a958f", weight: 2, dashArray: "2 6" } }).addTo(layers);
    for (const [lon, lat] of r.raw.coordinates) {
      L.circleMarker([lat, lon], { radius: 2, color: "#8a958f", weight: 1, fillOpacity: .8 }).addTo(layers);
    }
    bounds.push(raw.getBounds());
  }
  if (r.proposed) {
    const proposed = L.geoJSON(r.proposed, { style: { color: "#0b6e4f", weight: 6, opacity: .9 } }).addTo(layers);
    bounds.push(proposed.getBounds());
  }
  if (bounds.length) map.fitBounds(bounds.reduce((a, b) => a.extend(b)), panelPadding());
}

// Encuadra el recorrido en el espacio que deja libre el panel de detalle (a la derecha en
// pantallas anchas, abajo en las chicas).
function panelPadding() {
  const panel = document.getElementById("panel");
  const mapBox = document.getElementById("map").getBoundingClientRect();
  const box = panel.hidden ? null : panel.getBoundingClientRect();
  if (!box) return { padding: [40, 40] };
  const onRight = box.left > mapBox.left + mapBox.width / 2;
  return onRight
    ? { paddingTopLeft: [40, 40], paddingBottomRight: [mapBox.right - box.left + 20, 40] }
    : { paddingTopLeft: [40, 40], paddingBottomRight: [40, mapBox.bottom - box.top + 20] };
}

function renderPanel(r) {
  const panel = document.getElementById("panel");
  const s = r.stats || {};
  const rows = [
    ["Grabó", r.recorded_by === "driver" ? `Conductor (${r.plate})` : "Pasajero (anónimo)"], ["Grabada", fmtDate(r.started_at)], ["Largo", km(s.length_m)],
    ["Duración", s.duration_min != null ? `${s.duration_min} min` : "—"],
    ["Puntos usados / recibidos", s.used_points != null ? `${s.used_points} / ${s.raw_points}` : "—"],
    ["Saltos de GPS descartados", s.outliers_dropped ?? "—"], ["Puntos detenido descartados", s.stationary_dropped ?? "—"],
    ["Mayor tramo sin señal", s.max_gap_m != null ? `${s.max_gap_m} m` : "—"],
    // Lo ajusta OSRM en segundo plano unos segundos después de terminar la grabación.
    ["Ajustado a las calles", !s.map_matching ? (r.status === "pending_review" ? "Procesando… (recarga en unos segundos)" : "—")
      : s.map_matching.applied ? `Sí (confianza ${Math.round(s.map_matching.confidence * 100)} %)` : `No: ${s.map_matching.reason}`],
  ];
  const tableOf = () => el("table", {}, ...rows.map(([k, v]) => el("tr", {}, el("td", { textContent: k }), el("td", { textContent: String(v) }))));
  const legend = el("div", { className: "legend" },
    el("span", { className: "proposed", textContent: "Trazado propuesto" }),
    el("span", { className: "raw", textContent: "Puntos GPS recibidos" }),
    el("span", { className: "official", textContent: "Trazado oficial actual (si existe)" }),
    el("span", { className: "recorded", textContent: "Ya grabado y aprobado" }),
  );
  if (s.merge) {
    rows.push(["Tramo nuevo sumado", s.merge.replaced ? `${km(s.merge.added_m)} (reemplazó lo anterior)` : km(s.merge.added_m)],
      ["Ya estaba cubierto", km(s.merge.covered_m)]);
  }
  const table = tableOf();
  const content = [
    el("h2", { textContent: `${lineLabel(r)} · ${dirLabel(r.direction)}` }),
    el("div", { className: "status-line", textContent: r.line_status === "pending_review"
      ? "Línea nueva propuesta por un pasajero: al aprobar este recorrido también se aprueba la línea."
      : r.line_has_official_route
      ? "La línea ya tiene trazado oficial: compara antes de aprobar."
      : "La línea no tiene trazado oficial: al aprobar, este tramo se suma a lo ya grabado (en naranjo)." }),
    ...(r.contributor_id ? [el("div", { className: "actions" }, el("button", { className: "btn-ghost",
      textContent: "Ver aportante (moderar)", onclick: () => showContributor(r.contributor_id) }))] : []),
    ...(r.comment ? [el("div", { className: "quote", textContent: `Comentario: “${r.comment}”` })] : []),
    ...(r.sign_text ? [el("div", { className: "quote", textContent: `Letrero según quien grabó: “${r.sign_text}”` })] : []),
    legend, table,
    ...r.warnings.map((w) => el("div", { className: "warning", textContent: w })),
  ];
  if (r.status === "pending_review") {
    const note = el("textarea", { placeholder: "Nota (opcional): por qué se aprueba o rechaza" });
    const error = el("div", { className: "error" });
    // El pasajero puede no saber el sentido: el administrador lo elige comparando con el oficial.
    const direction = el("select", {},
      el("option", { value: "", textContent: "Elegir…" }),
      el("option", { value: "ida", textContent: "Ida" }),
      el("option", { value: "regreso", textContent: "Regreso" }));
    if (r.direction) direction.value = r.direction;
    // El registro oficial no trae el letrero: lo que anotó el pasajero queda como nombre de la línea.
    const lineName = el("input", { value: r.sign_text || r.line_name || "", placeholder: "Ej. Metro Bellavista – Av. La Florida" });
    // Por defecto se suma solo lo nuevo; reemplazar sirve para corregir un trazado grabado malo.
    const replace = el("input", { type: "checkbox" });
    const act = (action) => async () => {
      if (action === "approve" && !direction.value) {
        error.textContent = "Elige si el recorrido es de ida o de regreso.";
        return;
      }
      buttons.forEach((b) => (b.disabled = true));
      try {
        const newName = lineName.value.trim();
        const body = {
          note: note.value || null,
          ...(action === "approve" ? { direction: direction.value } : {}),
          ...(action === "approve" && newName && newName !== r.line_name ? { line_name: newName } : {}),
          ...(action === "approve" && replace.checked ? { replace_previous: true } : {}),
        };
        await api(`/admin/recordings/${r.id}/${action}`, { method: "POST", body: JSON.stringify(body) });
        closePanel();
        loadList();
      } catch (err) {
        error.textContent = err.message;
        buttons.forEach((b) => (b.disabled = false));
      }
    };
    const approve = el("button", { className: "btn-primary", textContent: "Aprobar trazado", onclick: act("approve") });
    const reject = el("button", { className: "btn-danger", textContent: "Rechazar", onclick: act("reject") });
    const buttons = [approve, reject];
    content.push(el("label", { className: "field" }, "Sentido", direction),
      el("label", { className: "field" }, "Letrero de la línea (opcional)", lineName),
      el("label", { className: "check" }, replace, " Reemplazar lo grabado antes en este sentido (en vez de sumar)"), note,
      el("div", { className: "actions" }, approve, reject), error);
  } else if (r.review_note) {
    content.push(el("div", { className: "status-line", textContent: `Nota: ${r.review_note}` }));
  }
  panel.replaceChildren(...content);
}

// --- Líneas propuestas por pasajeros ---

async function loadLines() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  try {
    let items = await api(`/admin/lines?status_filter=${currentStatus}`);
    // "Aprobadas" muestra solo las que vinieron de pasajeros, no las ~400 del registro oficial.
    if (currentStatus === "active") items = items.filter((l) => l.source === "contributed");
    if (!items.length) {
      list.replaceChildren(el("div", { className: "empty", textContent: "No hay líneas en este estado." }));
      return;
    }
    list.replaceChildren(...items.map((l) => {
      const item = el("div", { className: "item" + (l.code === selectedId ? " selected" : "") },
        el("div", { className: "title", textContent: l.name || l.code }),
        el("div", { className: "meta", textContent: `${l.code} · ${l.commune || "Comuna sin indicar"} · ${fmtDate(l.created_at)}` }),
        el("div", {}, el("span", { className: "badge " + (l.recordings ? "ok" : "warn"),
          textContent: l.recordings ? `${l.recordings} grabación(es)` : "Sin recorrido grabado" })),
      );
      item.dataset.code = l.code;
      item.onclick = () => selectLine(l);
      return item;
    }));
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
  }
}

function selectLine(l) {
  selectedId = l.code;
  layers.clearLayers();
  document.querySelectorAll(".item").forEach((n) => n.classList.toggle("selected", n.dataset.code === l.code));
  const panel = document.getElementById("panel");
  panel.hidden = false;
  const content = [
    el("h2", { textContent: l.name || l.code }),
    el("div", { className: "status-line", textContent: `Código asignado ${l.code} · propuesta el ${fmtDate(l.created_at)}` }),
    ...(l.description ? [el("div", { className: "quote", textContent: `“${l.description}”` })] : []),
    el("div", { className: "status-line", textContent: l.recordings
      ? `Tiene ${l.recordings} grabación(es): revísalas en "Recorridos grabados". Aprobar un recorrido aprueba también la línea.`
      : "Aún no tiene recorrido grabado: si la apruebas, aparecerá en la búsqueda de líneas pero sin trazado." }),
  ];
  if (l.status === "pending_review") {
    const name = el("input", { value: l.name || "" });
    const commune = el("input", { value: l.commune || "", placeholder: "Ej. La Florida" });
    const note = el("textarea", { placeholder: "Nota (opcional), p. ej. “duplicada de 233010”" });
    const error = el("div", { className: "error" });
    const act = (action) => async () => {
      buttons.forEach((b) => (b.disabled = true));
      try {
        const body = { note: note.value || null, name: name.value || null, commune: commune.value || null };
        await api(`/admin/lines/${encodeURIComponent(l.code)}/${action}`, { method: "POST", body: JSON.stringify(body) });
        closePanel();
        loadList();
      } catch (err) {
        error.textContent = err.message;
        buttons.forEach((b) => (b.disabled = false));
      }
    };
    const approve = el("button", { className: "btn-primary", textContent: "Aprobar línea", onclick: act("approve") });
    const reject = el("button", { className: "btn-danger", textContent: "Rechazar", onclick: act("reject") });
    const buttons = [approve, reject];
    content.push(
      el("label", { className: "field" }, "Letrero / nombre", name),
      el("label", { className: "field" }, "Comuna", commune),
      note, el("div", { className: "actions" }, approve, reject), error,
      el("div", { className: "status-line", textContent: "Rechazar la línea también rechaza sus grabaciones pendientes." }),
    );
  } else if (l.review_note) {
    content.push(el("div", { className: "status-line", textContent: `Nota: ${l.review_note}` }));
  }
  panel.replaceChildren(...content);
}

// --- Vehículos: registrar y entregar el QR que vincula el teléfono del conductor ---

// El QR es un enlace que abre la app del conductor (o se escanea desde ella). El token solo se
// guarda como hash en el servidor: se muestra esta vez y, si se pierde, se genera otro.
function showCredentials(v, title) {
  const link = `colectivos://driver?vehicle=${v.id}&token=${encodeURIComponent(v.device_token)}`;
  const qr = qrcode(0, "M");
  qr.addData(link);
  qr.make();
  const src = qr.createDataURL(8, 16);
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: title }),
    el("div", { className: "status-line", textContent: `${v.plate} · línea ${v.line_code} · ${v.max_capacity} asientos` }),
    el("div", { className: "qr" },
      el("img", { src, alt: "Código QR para vincular el teléfono del conductor" }),
      el("a", { href: src, download: `qr-${v.plate}.gif`, textContent: "Descargar imagen del QR" })),
    el("div", { className: "warning", textContent: "Guárdalo o envíaselo al conductor ahora: por seguridad no se puede volver a mostrar." }),
    el("div", { className: "status-line", textContent: "En la app: Soy conductor → Escanear código QR. Si prefiere escribirlos:" }),
    el("div", { className: "field" }, "ID del vehículo", el("div", { className: "secret", textContent: v.id })),
    el("div", { className: "field" }, "Token del dispositivo", el("div", { className: "secret", textContent: v.device_token })),
  );
}

async function loadVehicles() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  try {
    const [items, applications] = await Promise.all([api("/vehicles"), api("/admin/driver-applications?status_filter=pending")]);
    const add = el("div", { className: "item" }, el("div", { className: "title", textContent: "+ Registrar vehículo" }),
      el("div", { className: "meta", textContent: "Crea el auto y entrega el QR al conductor" }));

    const pending = applications.map((a) => {
      const item = el("div", { className: "item" + (a.id === selectedId ? " selected" : "") },
        el("div", { className: "title", textContent: `Solicitud: ${a.plate} · línea ${a.line_code}` }),
        el("div", { className: "meta", textContent: `${a.max_capacity} asientos · ${fmtDate(a.created_at)}${a.note ? ` · “${a.note}”` : ""}` }),
        el("span", { className: "badge warn", textContent: "Pide inscripción desde la app" }));
      item.onclick = () => selectApplication(a);
      return item;
    });

      const item = el("div", { className: "item" + (v.id === selectedId ? " selected" : "") },

function newVehicleForm() {
  closePanel();
  const plate = el("input", { placeholder: "BCDF12" });

function selectVehicle(v) {
  selectedId = v.id;
  layers.clearLayers();
  const error = el("div", { className: "error" });
  const rotate = el("button", { className: "btn-primary", textContent: "Generar QR nuevo", onclick: async () => {

      showCredentials(await api(`/vehicles/${v.id}/token`, { method: "POST" }), "QR nuevo");

    el("div", { className: "status-line", textContent: "El QR se muestra solo al registrar. Si el conductor lo perdió o cambió de teléfono, genera uno nuevo." }),
    el("div", { className: "actions" }, rotate), error);

// --- Datos: aportes de pasajeros por línea y por zona -------------------------------------------
let stats = null;
const fmtInt = (n) => (n ?? 0).toLocaleString("es-CL");
const lineTitle = (l) => l.name || l.description || `Línea ${l.line_code}`;
const communeLabel = (c) => !c || c === "Sin asignar" ? "Sin comuna" : c;

async function loadStats() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  try {
    stats = await api(`/admin/stats?days=${currentStatus}`);
    list.replaceChildren(
      el("div", { className: "item", onclick: showStatsSummary },
        el("div", { className: "title", textContent: "Resumen y zonas" }),
        el("div", { className: "meta", textContent: "Totales del período y mapa de dónde se aporta" })),
      ...(stats.lines.length ? stats.lines.map((l) => {
        const parts = [
          `${fmtInt(l.sightings)} marca${l.sightings === 1 ? "" : "s"}`,
          `${l.recordings_approved} grab. aprobada${l.recordings_approved === 1 ? "" : "s"}`,
          ...(l.recordings_pending ? [`${l.recordings_pending} pendiente${l.recordings_pending === 1 ? "" : "s"}`] : []),
          ...(l.recorded_km ? [`${km(l.recorded_km * 1000)} grabados`] : []),
        ];
        const item = el("div", { className: "item" + (l.line_code === selectedId ? " selected" : "") },
          el("div", { className: "title", textContent: `${l.line_code} · ${lineTitle(l)}` }),
          el("div", { className: "meta", textContent: parts.join(" · ") }),
          el("div", { className: "meta", textContent: l.last_activity ? `Última actividad ${fmtDate(l.last_activity)}` : "Sin actividad en el período" }));
        item.onclick = () => selectStatsLine(l, item);
        return item;
      }) : [el("div", { className: "empty", textContent: "Aún no hay aportes en este período." })]));
    showStatsSummary();
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
  }
}

function showStatsSummary() {
  if (!stats) return;
  selectedId = null;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  const t = stats.totals;
  const rec = t.recordings;
  const kpi = (value, label) => el("div", { className: "kpi" }, el("b", { textContent: value }), el("span", { textContent: label }));
  const zones = [...stats.zones].sort((a, b) => (b.sightings + b.recordings) - (a.sightings + a.recordings));
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: "Datos de los pasajeros" }),
    el("div", { className: "status-line", textContent: `Últimos ${stats.days} días` }),
    el("div", { className: "kpis" },
      kpi(fmtInt(t.active_contributors), `pasajeros activos (de ${fmtInt(t.contributors)} registrados)`),
      kpi(fmtInt(t.sightings), `marcas "pasó un colectivo" (${fmtInt(t.sightings_7d)} en 7 días)`),
      kpi(fmtInt(rec.approved || 0), `grabaciones aprobadas${rec.pending_review ? ` · ${rec.pending_review} por revisar` : ""}`),
      kpi(km(t.recorded_km * 1000), `grabados en ${t.lines_with_recorded_route} línea${t.lines_with_recorded_route === 1 ? "" : "s"}`),
      kpi(fmtInt(t.lines_active), "líneas activas"),
      kpi(fmtInt(t.lines_pending), "líneas propuestas sin revisar")),
    el("div", { className: "legend" },
      el("span", { className: "sightings", textContent: "Zona con marcas (~1 km)" }),
      el("span", { className: "recordings", textContent: "Zona donde empezaron grabaciones" })),
    el("h3", { textContent: "Aportantes más activos" }),
    ...(stats.top_contributors.length ? stats.top_contributors.map((c) => el("div", { className: "zone", onclick: () => showContributor(c.id) },
      el("span", { textContent: `${c.id.slice(0, 8)}${c.is_blocked ? " · bloqueado" : ""}` }),
      el("b", { textContent: `${fmtInt(c.sightings)} marcas · ${c.recordings} grab.${c.rejected ? ` (${c.rejected} rechaz.)` : ""}` })))
      : [el("div", { className: "status-line", textContent: "Sin aportes en el período." })]),
    el("h3", { textContent: "Zonas más activas" }),
    ...(zones.length ? zones.slice(0, 12).map((z) => el("div", { className: "zone", onclick: () => map.setView([z.lat, z.lon], 15) },
      el("span", { textContent: `${communeLabel(z.commune)} · ${z.lines} línea${z.lines === 1 ? "" : "s"}` }),
      el("b", { textContent: `${fmtInt(z.sightings)} marca${z.sightings === 1 ? "" : "s"} · ${fmtInt(z.recordings)} grab.` })))
      : [el("div", { className: "status-line", textContent: "Sin aportes en el período." })]),
  );
  drawZones(zones);
}

// Un círculo por celda: verde si hay más marcas, naranjo si hay más inicios de grabación;
// el tamaño crece con la cantidad (raíz cuadrada, para que una zona muy activa no tape el resto).
function drawZones(zones) {
  layers.clearLayers();
  if (!zones.length) return;
  for (const z of zones) {
    const total = z.sightings + z.recordings;
    const color = z.sightings >= z.recordings ? "#0b6e4f" : "#e07a1f";
    L.circleMarker([z.lat, z.lon], { radius: 6 + 4 * Math.sqrt(total), color, weight: 1, fillColor: color, fillOpacity: .45 })
      .bindPopup(`<b>${communeLabel(z.commune)}</b><br>${z.sightings} marca(s) · ${z.recordings} grabación(es)<br>${z.lines} línea(s)`)
      .addTo(layers);
  }
  map.fitBounds(L.latLngBounds(zones.map((z) => [z.lat, z.lon])).pad(0.3), { maxZoom: 14, ...panelPadding() });
}

async function selectStatsLine(l, item) {
  selectedId = l.line_code;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  item.classList.add("selected");
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: `Línea ${l.line_code}` }),
    el("div", { className: "status-line", textContent: [lineTitle(l), communeLabel(l.commune)].join(" · ") }),
    el("div", { className: "kpis" },
      el("div", { className: "kpi" }, el("b", { textContent: fmtInt(l.sightings) }), el("span", { textContent: "marcas en el período" })),
      el("div", { className: "kpi" }, el("b", { textContent: km(l.recorded_km * 1000) }), el("span", { textContent: "recorrido grabado y aprobado" })),
      el("div", { className: "kpi" }, el("b", { textContent: fmtInt(l.recordings_approved) }), el("span", { textContent: "grabaciones aprobadas" })),
      el("div", { className: "kpi" }, el("b", { textContent: fmtInt(l.recordings_pending) }), el("span", { textContent: "grabaciones por revisar" }))),
    el("div", { className: "legend" },
      el("span", { className: "official", textContent: "Trazado oficial" }),
      el("span", { className: "recorded", textContent: "Grabado por pasajeros o conductores" })),
    el("div", { className: "actions" }, el("button", { className: "btn-ghost", textContent: "Volver al resumen", onclick: showStatsSummary })),
  );
  layers.clearLayers();
  try {
    const routes = await fetch(`${API}/routes/${encodeURIComponent(l.line_code)}`).then((x) => x.ok ? x.json() : null);
    const drawn = (routes?.features || []).map((f) => L.geoJSON(f.geometry, { style: f.properties.source === "recorded"
      ? { color: "#e07a1f", weight: 8, opacity: .55 } : { color: "#3f51b5", weight: 3, dashArray: "8 8", opacity: .8 } }).addTo(layers));
    if (drawn.length) map.fitBounds(drawn.reduce((b, g) => b.extend(g.getBounds()), drawn[0].getBounds()), panelPadding());
    else panel.append(el("div", { className: "status-line", textContent: "Esta línea aún no tiene trazado." }));
  } catch {}
}

// --- Errores de la app (los reporta la app sola, anónimos) --------------------------------------
async function loadErrors() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  layers.clearLayers();
  try {
    const groups = await api(`/admin/errors?days=${currentStatus}`);

      list.replaceChildren(el("div", { className: "empty", textContent: "Sin errores en el período. 🎉" }));

        el("div", { className: "title", textContent: g.message }),
        el("div", { className: "meta", textContent: `${g.count} ${g.count === 1 ? "vez" : "veces"} · último ${fmtDate(g.last_seen)}` }),
        ...(g.fatal ? [el("span", { className: "badge danger", textContent: `Cerró la app ${g.fatal} ${g.fatal === 1 ? "vez" : "veces"}` })] : []),

// --- Moderación: un aportante anónimo -------------------------------------------------------------
async function showContributor(id) {
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(el("div", { className: "status-line", textContent: "Cargando…" }));
  let c;
  try {
    c = await api(`/admin/contributors/${id}`);
  } catch (err) {
    panel.replaceChildren(el("div", { className: "error", textContent: err.message }));
    return;
  }
  const rec = c.recordings;
  const rows = [
    ["Registrado", fmtDate(c.created_at)], ["Estado", c.is_blocked ? "Bloqueado" : "Activo"],
    ["Marcas \"pasó un colectivo\"", c.sightings], ["Última marca", fmtDate(c.last_sighting_at)],
    ["Grabaciones aprobadas", rec.approved || 0], ["Pendientes", rec.pending_review || 0],
    ["Rechazadas", rec.rejected || 0], ["Líneas propuestas", c.lines_proposed],
  ];
  const purge = el("input", { type: "checkbox", checked: true });
  const error = el("div", { className: "error" });
  const done = el("div", { className: "status-line" });
  const act = (path, body, question) => async () => {
    if (question && !confirm(question)) return;
    try {
      const r = await api(`/admin/contributors/${id}/${path}`, { method: "POST", body: JSON.stringify(body) });
      await showContributor(id);
      const summary = [`${r.pending_rejected} grabación(es) pendiente(s) rechazada(s)`, `${r.routes_deactivated} tramo(s) desactivado(s)`,
        `${r.sightings_deleted} marca(s) borrada(s)`, `${r.lines_rejected} línea(s) rechazada(s)`];
      document.getElementById("panel").append(el("div", { className: "status-line",
        textContent: path === "block" && body.purge ? `Listo: ${summary.join(", ")}.` : "Listo." }));
      if (mode === "stats") loadStats(); else loadList();
    } catch (err) {
      error.textContent = err.message;
    }
  };
  panel.replaceChildren(
    el("h2", { textContent: "Aportante anónimo" }),
    el("div", { className: "secret", textContent: c.id }),
    el("table", {}, ...rows.map(([k, v]) => el("tr", {}, el("td", { textContent: k }), el("td", { textContent: String(v) })))),
    ...(c.is_blocked
      ? [el("div", { className: "warning", textContent: "Bloqueado: la app le responde que no puede enviar aportes." }),
         el("div", { className: "actions" }, el("button", { className: "btn-ghost", textContent: "Desbloquear",
           onclick: act("unblock", {}, null) }))]
      : [el("label", { className: "check" }, purge, " Deshacer también sus aportes (rechazar pendientes, quitar sus tramos aprobados, borrar sus marcas)"),
         el("div", { className: "actions" }, el("button", { className: "btn-danger", textContent: "Bloquear",
           onclick: () => act("block", { purge: purge.checked },
             purge.checked ? "¿Bloquear a este aportante y deshacer sus aportes? Lo borrado no se recupera." : "¿Bloquear a este aportante?")() }))]),
    done, error,
  );
}

// --- Flota en vivo: todos los autos transmitiendo, se refresca cada 5 s ----------------------------
const FLEET_STATUS = {
  on_route: ["En ruta", "#1e8e3e", "ok"], deviating: ["Desviándose", "#e8a317", "warn"],
  off_route: ["Fuera de ruta", "#c5221f", "danger"], no_route: ["Línea sin trazado", "#80868b", "new"],
};
let fleetTimer = null;
let fleetFitted = false;
let fleetSelected = null;

function stopFleet() {
  if (fleetTimer) clearInterval(fleetTimer);
  fleetTimer = null;
  fleetFitted = false;
  fleetSelected = null;
}

const agoText = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `hace ${s} s` : `hace ${Math.floor(s / 60)} min`;
};

async function loadFleet() {
  if (!fleetTimer) fleetTimer = setInterval(() => mode === "fleet" && refreshFleet(), 5000);
  await refreshFleet();
}

async function refreshFleet() {
  const list = document.getElementById("list");
  let cars;
  try {
    cars = await api("/admin/fleet");
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
    return;
  }
  const counts = Object.fromEntries(Object.keys(FLEET_STATUS).map((k) => [k, cars.filter((c) => c.route_status === k).length]));
  list.replaceChildren(
    el("div", { className: "item" },
      el("div", { className: "title", textContent: `${cars.length} auto${cars.length === 1 ? "" : "s"} transmitiendo` }),
      el("div", { className: "meta", textContent: Object.entries(counts).filter(([, n]) => n)
        .map(([k, n]) => `${n} ${FLEET_STATUS[k][0].toLowerCase()}`).join(" · ") || "Ningún conductor en turno ahora." })),
    ...cars.map((c) => {
      const [label, , badge] = FLEET_STATUS[c.route_status];
      const item = el("div", { className: "item" + (c.vehicle_id === fleetSelected ? " selected" : "") },
        el("div", { className: "title", textContent: `${c.plate} · línea ${c.line_code}` }),
        el("div", { className: "meta", textContent: `${c.available_seats} de ${c.max_capacity} cupos · ${c.speed_kmh != null ? `${Math.round(c.speed_kmh)} km/h · ` : ""}${agoText(c.last_seen)}` }),
        el("span", { className: `badge ${badge}`, textContent: c.route_status === "off_route" || c.route_status === "deviating"
          ? `${label} (${Math.round(c.distance_to_route_m)} m)` : label }));
      item.onclick = () => selectFleetCar(c);
      return item;
    }));
  layers.clearLayers();
  for (const c of cars) {
    const [label, color] = FLEET_STATUS[c.route_status];
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: "", iconSize: [26, 26],
      html: `<div class="car-dot" style="background:${color}">${c.available_seats}</div>` }) })
      .bindPopup(`<b>${c.plate}</b> · línea ${c.line_code}<br>${c.available_seats} de ${c.max_capacity} cupos · ${label}<br>${agoText(c.last_seen)}`)
      .on("click", () => selectFleetCar(c))
      .addTo(layers);
  }
  const selected = cars.find((c) => c.vehicle_id === fleetSelected);
  if (selected) showFleetCar(selected);
  if (cars.length && !fleetFitted) {
    fleetFitted = true;
    map.fitBounds(L.latLngBounds(cars.map((c) => [c.lat, c.lon])).pad(0.3), { maxZoom: 15, ...panelPadding() });
  }
}

function selectFleetCar(c) {
  fleetSelected = c.vehicle_id;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  showFleetCar(c);
  map.setView([c.lat, c.lon], Math.max(map.getZoom(), 15));
}

function showFleetCar(c) {
  const [label] = FLEET_STATUS[c.route_status];
  const rows = [
    ["Línea", c.line_code], ["Cupos libres", `${c.available_seats} de ${c.max_capacity}`], ["Estado", label],
    ["Distancia al trazado", c.distance_to_route_m != null ? `${Math.round(c.distance_to_route_m)} m` : "—"],
    ["Velocidad", c.speed_kmh != null ? `${Math.round(c.speed_kmh)} km/h` : "—"], ["Última señal", agoText(c.last_seen)],
  ];
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(el("h2", { textContent: c.plate }),
    el("table", {}, ...rows.map(([k, v]) => el("tr", {}, el("td", { textContent: k }), el("td", { textContent: String(v) })))),
    el("div", { className: "actions" }, el("button", { className: "btn-ghost", textContent: "Cerrar",
      onclick: () => { fleetSelected = null; document.getElementById("panel").hidden = true; } })));
}

function selectApplication(a) {
  selectedId = a.id;
  layers.clearLayers();
  const line = el("input", { value: a.line_code });

        note: note.value || null, ...(action === "approve" ? { line_code: line.value.trim(), max_capacity: Number(capacity.value) } : {}) }) });

    el("div", { className: "status-line", textContent: "Al aprobar, su teléfono queda vinculado solo (sin QR) la próxima vez que abra el modo conductor." }),
    el("label", { className: "field" }, "Línea", line),
    el("label", { className: "field" }, "Asientos para pasajeros", capacity),
    note, el("div", { className: "actions" }, approve, reject), error,

// --- Ocupación por hora (promedio de los cupos que informan los conductores) --------------------
async function loadOccupancy() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  layers.clearLayers();
  try {
    const lines = await api(`/admin/occupancy?days=${currentStatus}`);
    if (!lines.length) {
      list.replaceChildren(el("div", { className: "empty", textContent: "Aún no hay turnos de conductores en el período: la ocupación sale de los cupos que informan." }));
      return;
    }
    list.replaceChildren(...lines.map((l) => {
      const peak = l.hours.reduce((a, b) => (b.occupancy > a.occupancy ? b : a));
      const item = el("div", { className: "item" },
        el("div", { className: "title", textContent: `Línea ${l.line_code}` }),
        el("div", { className: "meta", textContent: `Más llena a las ${peak.hour}:00 (${Math.round(peak.occupancy * 100)} %) · ${l.vehicles} auto(s) · ${fmtInt(l.samples)} registros` }));
      item.onclick = () => {
        document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
        item.classList.add("selected");
        showOccupancy(l);
      };
      return item;
    }));
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
  }
}

function showOccupancy(l) {
  const byHour = Object.fromEntries(l.hours.map((h) => [h.hour, h]));
  const bars = el("div", { className: "bars" }, ...Array.from({ length: 24 }, (_, hour) => {
    const h = byHour[hour];
    return el("div", { className: h ? "" : "empty", style: `height:${h ? Math.max(4, h.occupancy * 100) : 2}%`,
      title: h ? `${hour}:00 · ${Math.round(h.occupancy * 100)} % lleno · ${h.samples} registros` : `${hour}:00 · sin datos` });
  }));
  const axis = el("div", { className: "bars-axis" }, ...Array.from({ length: 24 }, (_, hour) => el("span", { textContent: hour % 3 === 0 ? String(hour) : "" })));
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: `Ocupación · línea ${l.line_code}` }),
    el("div", { className: "status-line", textContent: `Qué tan llenos van los autos según la hora (promedio de los últimos ${currentStatus} días). Pasa el mouse por una barra para ver el detalle.` }),
    bars, axis,
    el("div", { className: "status-line", textContent: `${l.vehicles} auto(s) · ${fmtInt(l.samples)} registros de posición` }),
  );
}

const money = (v) => v == null ? "—" : `$${Number(v).toLocaleString("es-CL")}`;
const infoSummary = (x, empty = "Solo una nota") => [
  x.fare_day != null || x.fare_night != null ? `Día ${money(x.fare_day)} · noche ${money(x.fare_night)}` : null,
  x.first_departure || x.last_departure ? `${x.first_departure || "?"} a ${x.last_departure || "?"}` : null,
].filter(Boolean).join(" · ") || empty;

async function loadLineInfo() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  layers.clearLayers();
  try {
    const items = await api(`/admin/line-info?status_filter=${currentStatus}`);
    const importItem = el("div", { className: "item" }, el("div", { className: "title", textContent: "+ Cargar desde CSV" }),
      el("div", { className: "meta", textContent: "Tarifas y horarios de muchas líneas de una vez" }));

      list.replaceChildren(importItem, el("div", { className: "empty", textContent: "No hay datos informados en este estado." }));
      return;
    }
    list.replaceChildren(importItem, ...items.map((r) => {
      const item = el("div", { className: "item" + (r.id === selectedId ? " selected" : "") },
        el("div", { className: "title", textContent: `Línea ${r.line_code}` }),
        el("div", { className: "meta", textContent: `${infoSummary(r)} · ${fmtDate(r.created_at)}` }));
      item.onclick = () => selectLineInfo(r);
      return item;
    }));

    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));

}

function selectLineInfo(r) {
  selectedId = r.id;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  const input = (field, type = "text") => el("input", { type, value: r[field] ?? "", placeholder: r.current[field] ?? "" });
  const fields = { fare_day: input("fare_day", "number"), fare_night: input("fare_night", "number"),
    first_departure: input("first_departure"), last_departure: input("last_departure") };
  const error = el("div", { className: "error" });
  const pending = r.status === "pending";
  const act = (action) => async () => {
    buttons.forEach((b) => (b.disabled = true));
    try {
      const body = Object.fromEntries(Object.entries(fields).map(([k, i]) => [k, i.value === "" ? null : (i.type === "number" ? Number(i.value) : i.value)]));
      await api(`/admin/line-info/${r.id}/${action}`, { method: "POST", body: JSON.stringify(action === "apply" ? body : {}) });
      closePanel();
      loadList();
    } catch (err) {
      error.textContent = err.message;
      buttons.forEach((b) => (b.disabled = false));
    }
  };
  const apply = el("button", { className: "btn-primary", textContent: "Aplicar a la línea", onclick: act("apply") });
  const discard = el("button", { className: "btn-danger", textContent: "Descartar", onclick: act("discard") });
  const buttons = [apply, discard];
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: `Línea ${r.line_code}` }),
    el("div", { className: "status-line", textContent: `Informado por un pasajero el ${fmtDate(r.created_at)}. Hoy la línea tiene: ${infoSummary(r.current, "nada registrado")}.` }),
    ...(r.note ? [el("div", { className: "quote", textContent: `Nota: “${r.note}”` })] : []),
    el("label", { className: "field" }, "Tarifa de día (pesos)", fields.fare_day),
    el("label", { className: "field" }, "Tarifa nocturna (pesos)", fields.fare_night),
    el("label", { className: "field" }, "Primer auto (HH:MM)", fields.first_departure),
    el("label", { className: "field" }, "Último auto (HH:MM)", fields.last_departure),
    ...(pending ? [el("div", { className: "actions" }, apply, discard)] : []), error,
  );
}

async function loadNotices() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));

  try {
    const items = await api("/admin/notices");

    list.replaceChildren(add, ...items.map((n) => {
      const remove = el("button", { className: "btn-ghost", textContent: "Borrar", onclick: async (e) => {

function csvImportForm() {
  layers.clearLayers();
  const text = el("textarea", { placeholder: "linea;dia;noche;primero;ultimo\n233035;900;1100;06:15;23:30\n233025;;1200;;", style: "min-height:160px;font-family:monospace" });
  const result = el("div", { className: "status-line" });
  const run = el("button", { className: "btn-primary", textContent: "Cargar", onclick: async () => {
    run.disabled = true;
    result.textContent = "Cargando…";
    try {
      const r = await api("/admin/line-info/import", { method: "POST", body: JSON.stringify({ csv: text.value }) });
      result.replaceChildren(el("div", { textContent: `${r.updated} línea(s) actualizada(s).` }),
        ...r.errors.map((e) => el("div", { className: "error", textContent: e })));
    } catch (err) {
      result.replaceChildren(el("div", { className: "error", textContent: err.message }));
    } finally {
      run.disabled = false;
    }
  } });
  const file = el("input", { type: "file", accept: ".csv,text/csv,text/plain", onchange: async () => {
    if (file.files[0]) text.value = await file.files[0].text();
  } });
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: "Cargar tarifas y horarios" }),
    el("div", { className: "status-line", textContent: "Una fila por línea: código, tarifa de día, tarifa de noche, primer auto, último auto (HH:MM). Separado por coma o punto y coma; el encabezado es opcional. Una celda vacía no cambia lo que la línea ya tiene." }),
    el("label", { className: "field" }, "Archivo (opcional)", file),
    text, el("div", { className: "actions" }, run), result,
  );
}

async function selectReport(r) {
  selectedId = r.id;
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("selected"));
  layers.clearLayers();
  // El recorrido oficial de la línea y dónde estaba el pasajero al reportar.
  try {
    const route = await api(`/routes/${encodeURIComponent(r.line_code)}`);
    const shape = L.geoJSON(route, { style: { color: "#0B6E4F", weight: 4, opacity: 0.8 } }).addTo(layers);
    if (r.lat == null && shape.getBounds().isValid()) map.fitBounds(shape.getBounds(), { padding: [30, 30] });
  } catch {}
  if (r.lat != null) {
    L.circleMarker([r.lat, r.lon], { radius: 9, color: "#C5221F", fillOpacity: 0.8 }).addTo(layers).bindTooltip("Aquí estaba el pasajero");
    map.setView([r.lat, r.lon], 15);
  }
  const error = el("div", { className: "error" });
  const act = (action) => async () => {
    buttons.forEach((b) => (b.disabled = true));
    try {
      await api(`/admin/route-reports/${r.id}/${action}`, { method: "POST" });
      closePanel();
      loadList();
    } catch (err) {
      error.textContent = err.message;
      buttons.forEach((b) => (b.disabled = false));
    }
  };
  const resolve = el("button", { className: "btn-primary", textContent: "Resuelto", onclick: act("resolve") });
  const discard = el("button", { className: "btn-danger", textContent: "Descartar", onclick: act("discard") });
  const buttons = [resolve, discard];
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.replaceChildren(
    el("h2", { textContent: `Línea ${r.line_code}: ${REPORT_KINDS[r.kind] || r.kind}` }),
    el("div", { className: "status-line", textContent: `${r.line_description || ""} · reportado el ${fmtDate(r.created_at)}` }),
    ...(r.message ? [el("div", { className: "quote", textContent: `“${r.message}”` })] : []),
    el("div", { className: "status-line", textContent: "En verde el recorrido que tenemos; en rojo, dónde estaba el pasajero. Para corregirlo: graba el recorrido nuevo (o pídeselo a un conductor) y apruébalo con «Reemplazar»." }),
    ...(r.status === "pending" ? [el("div", { className: "actions" }, resolve, discard)] : []),
    el("button", { className: "btn-ghost", textContent: "Ver al aportante", onclick: () => showContributor(r.contributor_id) }),
    error,
  );
}

// --- Búsquedas sin resultado: dónde faltan líneas o nombres de lugares ---------------------------
async function loadMisses() {
  const list = document.getElementById("list");
  list.replaceChildren(el("div", { className: "empty", textContent: "Cargando…" }));
  layers.clearLayers();
  try {
    const m = await api(`/admin/search-misses?days=${currentStatus}`);
    const tripItems = m.trips.map((t) => {
      const item = el("div", { className: "item" },
        el("div", { className: "title", textContent: `Viaje sin colectivo · ${t.count} vez/veces` }),
        el("div", { className: "meta", textContent: `Destino cerca de ${t.to_lat.toFixed(3)}, ${t.to_lon.toFixed(3)} · ${fmtDate(t.last_at)}` }));
      item.onclick = () => showTripMiss(t);
      return item;
    });
    const placeItems = m.places.map((pl) => el("div", { className: "item" },
      el("div", { className: "title", textContent: `“${pl.query}”` }),
      el("div", { className: "meta", textContent: `Lugar no encontrado · ${pl.count} vez/veces · ${fmtDate(pl.last_at)}` })));
    // En el mapa, todos los destinos sin resultado (más grande = más búsquedas).
    m.trips.forEach((t) => L.circleMarker([t.to_lat, t.to_lon], { radius: 5 + Math.min(15, t.count * 2), color: "#C5221F", fillOpacity: 0.4 })
      .addTo(layers).bindTooltip(`${t.count} búsqueda(s) sin colectivo`));
    list.replaceChildren(
      el("div", { className: "empty", textContent: "Viajes que el planificador no pudo resolver (ni con Metro ni con dos colectivos) y lugares que OpenStreetMap no conoce. Anónimo, redondeado a ~100 m." }),
      ...(tripItems.length ? tripItems : [el("div", { className: "empty", textContent: "Ningún viaje sin resultado en el período." })]),
      ...(placeItems.length ? placeItems : [el("div", { className: "empty", textContent: "Ningún lugar sin resultado en el período." })]),
    );
  } catch (err) {
    list.replaceChildren(el("div", { className: "empty error", textContent: err.message }));
  }
}

function showTripMiss(t) {
  layers.clearLayers();
  const dest = L.circleMarker([t.to_lat, t.to_lon], { radius: 10, color: "#C5221F", fillOpacity: 0.7 }).addTo(layers).bindTooltip("Destino");
  const pts = [dest.getLatLng()];
  t.origins.forEach((o) => {
    L.circleMarker([o.lat, o.lon], { radius: 6, color: "#0B6E4F", fillOpacity: 0.7 }).addTo(layers).bindTooltip("Desde aquí");
    L.polyline([[o.lat, o.lon], [t.to_lat, t.to_lon]], { color: "#5F6B66", dashArray: "6 6", weight: 2 }).addTo(layers);
    pts.push(L.latLng(o.lat, o.lon));
  });
  map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 15 });
}

document.getElementById("modes").onclick = (e) => {
  const next = e.target.dataset?.mode;
  if (!next || next === mode) return;
  mode = next;
  currentStatus = { vehicles: "all", stats: "28", errors: "30", fleet: "all", occupancy: "30", lineinfo: "pending",
    notices: "active", reports: "pending", misses: "30" }[mode] || "pending_review";
  stopFleet();
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("active", b === e.target));
  closePanel();
  renderTabs();
  loadList();
};
renderTabs();
document.getElementById("enter").onclick = loadList;
keyInput.onkeydown = (e) => { if (e.key === "Enter") loadList(); };
if (keyInput.value) loadList();
</script>
</body>
</html>
