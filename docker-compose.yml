services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: colectivos
      POSTGRES_PASSWORD: colectivos
      POSTGRES_DB: colectivos
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colectivos -d colectivos"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]

volumes:
  pgdata:
